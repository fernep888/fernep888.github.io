<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ucapan dengan Video</title>
  <style>
    body { font-family: Arial; text-align: center; margin: 50px; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      max-width: 400px;
      margin: auto;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    video {
      margin-top: 15px;
      width: 100%;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Selamat Ulang Tahun 🎉</h2>
    <p>Semoga panjang umur dan sehat selalu!</p>
    <button onclick="playVideo()">▶ Putar Video</button>
    <video id="videoUcapan" controls>
      <source src="https://drive.google.com/uc?export=download&id=1FSnLQVYe7yD8spuDE4JOPOKf0lZcVrQN" type="video/mp4">
      Browser Anda tidak mendukung video.
    </video>
  </div>

  <script>
    function playVideo() {
      const vid = document.getElementById('videoUcapan');
      vid.style.display = "block";
      vid.play();
    }
  </script>
</body>
</html>
