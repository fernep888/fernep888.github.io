<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Play Video Google Drive</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background: #f3f3f3; 
      padding: 40px; 
    }
    .card {
      background: #fff; 
      border-radius: 12px; 
      padding: 20px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      max-width: 500px;
      margin: auto;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0b7dda;
    }
    video {
      margin-top: 20px;
      width: 100%;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Selamat Ulang Tahun 🎉</h2>
    <p>Semoga sehat selalu dan sukses ya!</p>
    
    <button onclick="playVideo()">▶ Putar Video</button>
    
    <!-- Ganti FILE_ID dengan ID videomu dari Google Drive -->
    <video id="videoUcapan" controls>
      <source src="https://drive.google.com/uc?export=download&id=1FSnLQVYe7yD8spuDE4JOPOKf0lZcVrQN" type="video/mp4">
      Browser Anda tidak mendukung video.
    </video>
  </div>

  <script>
    function playVideo() {
      const vid = document.getElementById('videoUcapan');
      vid.style.display = "block";
      vid.play();
    }
  </script>
</body>
</html>
