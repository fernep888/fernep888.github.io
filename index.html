<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kartu Ucapan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f0f0;
      padding: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      max-width: 400px;
      margin: auto;
    }
    .btn {
      background: #ff4081;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:hover {
      background: #e73370;
    }
    video {
      margin-top: 20px;
      width: 100%;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Selamat Ulang Tahun 🎉</h2>
    <p>Semoga panjang umur, sehat selalu, dan sukses!</p>
    <button class="btn" onclick="playVideo()">▶ Putar Video</button>
    <video id="videoUcapan" controls>
      <source src="https://drive.google.com/uc?export=download&id=1FSnLQVYe7yD8spuDE4JOPOKf0lZcVrQN" type="video/mp4">
      Browser Anda tidak mendukung video.
    </video>
  </div>

  <script>
    function playVideo() {
      const vid = document.getElementById('videoUcapan');
      vid.style.display = "block"; 
      vid.play();
    }
  </script>
</body>
</html>
